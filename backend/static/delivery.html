<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Video · 交付入口</title>
<style>
  *{box-sizing:border-box} body{font:14px/1.6 -apple-system,"PingFang SC",sans-serif;margin:0;background:#f9fafb;color:#111}
  header{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 20px;display:flex;gap:12px;align-items:center}
  header a{color:#2563eb;text-decoration:none} h1{font-size:18px;margin:0}
  main{max-width:1000px;margin:16px auto;padding:0 16px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}
  th,td{padding:10px 12px;border-bottom:1px solid #eee;text-align:left;font-size:13px}
  th{background:#fafafa;font-weight:600}
  .st{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px}
  .st.ready{background:#f0fdf4;color:#16a34a}.st.analyzing{background:#eef2ff;color:#4338ca}
  .st.failed{background:#fef2f2;color:#dc2626}.st.other{background:#f3f4f6;color:#6b7280}
  a.dl{color:#2563eb} details{margin:4px 0}
</style>
<link rel="stylesheet" href="/maintenance.css">
<script src="/maintenance.js"></script>
</head>
<body>
<header><h1>AI Video · 交付入口</h1><a href="/advanced.html">任务准备 →</a><a href="/review.html">审核页 →</a><a href="/#/settings">返回产品设置</a></header>
<main>
  <h2>任务与成果</h2>
  <p class="hint" style="color:#6b7280;font-size:13px">列表展示历史任务状态与下载入口；「继续审核」进入对应任务继续保留/淘汰/修边/导出。</p>
  <div class="table-scroll"><table id="taskTable">
    <thead><tr><th>任务</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
    <tbody><tr><td colspan="4">加载中…</td></tr></tbody>
  </table></div>
</main>
<script>
const api=async(u,o)=>{const r=await fetch('/api/v1'+u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d?.error?.message||('HTTP '+r.status));return d;};
const $=id=>document.getElementById(id);
function stCls(s){ return s==='ready_for_review'||s==='completed'?'ready':(s==='analyzing'||s==='assets_locked'?'analyzing':(s==='failed'?'failed':'other')); }
async function load(){
  try{
    const d=await api('/tasks');
    const rows=await Promise.all(d.tasks.map(async t=>{
      let man=null;
      try{ const j=await api('/export/jobs/task/'+t.task_id); man=(j.job&&j.job.manifest_file)?j.job.manifest_file:null; }catch(e){}
      return `<tr>
        <td>${t.task_id.slice(0,16)}</td>
        <td><span class="st ${stCls(t.status)}">${Maintenance.status(t.status)}</span></td>
        <td>${Maintenance.date(t.created_at)}</td>
        <td><a class="dl" href="/review.html?task=${t.task_id}">继续审核</a>
            ${man?` · <a class="dl" href="/api/v1/export/file/${encodeURIComponent(man)}">清单</a>`:''}</td>
      </tr>`;
    }));
    $('taskTable').querySelector('tbody').innerHTML=rows.join('');
  }catch(e){ $('taskTable').querySelector('tbody').innerHTML=`<tr><td colspan="4">${e.message}</td></tr>`; }
}
load();
</script>
</body>
</html>
